# Build the Speechify installers (Windows + Linux + macOS).
#
# Triggers:
#   * Branch push to main  - builds every target and publishes a dated
#     GitHub Release with the Windows .exe plus one tarball per unix
#     target.
#   * workflow_dispatch     - manual trigger; uploads as artifacts only,
#     no release.
#
# Jobs:
#   * setup          - resolves the date-based version once so every
#                      build and the release agree on the string.
#   * build-windows  - msys2 mingw32/mingw64 + Inno Setup, as a matrix over
#                      arch. Produces TWO installers:
#                        x64 -> spfy-setup-<version>.exe
#                        x86 -> spfy-setup-<version>-x86.exe
#                      Both register SAPI and drop the FE data into
#                      %USERPROFILE%\Documents. They are separate installers,
#                      not one universal build, because the x86 one has no
#                      spfy_sapi64.dll to ship and registers through
#                      System32\regsvr32 instead of SysWOW64\regsvr32.
#                      The 32-bit payload itself needed no change: it was
#                      always i686/min-OS-4.0/msvcrt with no post-NT-6.1
#                      imports - the installer's ArchitecturesAllowed was
#                      the only thing refusing 32-bit Windows.
#   * build-unix     - matrix over linux-x86 (i386), linux-x86_64,
#                      linux-armv7, linux-arm64, macos-arm64 and
#                      macos-x86_64. No SAPI (Windows COM only); each leg
#                      produces spfy-<target>-<version>.tar.gz. fail-fast
#                      is off so one target can't hide the others' results.
#   * release        - publishes on push once setup + build-windows
#                      succeed. Unix tarballs are attached if they built;
#                      any that didn't are annotated as warnings, so a
#                      single failed/unavailable leg yields a partial
#                      release rather than none at all.
#
# Toolchains:
#   * Windows: msys2 mingw32 (i686) for the main project + 32-bit SAPI
#     DLL, msys2 mingw64 (x86_64) for the 64-bit SAPI shim, Inno Setup 6
#     via Chocolatey. The x86 leg skips the 64-bit shim step entirely; it
#     still needs the mingw64 cmake/ninja, which are what drive the
#     mingw32 compiler (see the Configure step).
#   * Linux: stock gcc, cmake, ninja. gcc-multilib is needed ONLY by the
#     i386 leg, and only for its 32-bit libc.
#   * Linux armv7: no hosted 32-bit ARM runner exists, so this leg builds
#     inside a qemu-emulated debian:bookworm container on an x86_64 runner.
#     Emulated, therefore slow - see its timeout in the matrix.
#   * macOS: AppleClang + brew ninja.
#
# Every unix leg - native or emulated - runs spfy/ci/build_unix.sh, so the
# legs cannot drift apart in flags, build type, or pass criteria. That
# script also VERIFIES: it synthesizes the reference phrase through
# en-US/tom (committed) and fails the leg unless the WAV's sha256 matches.
# Byte-exactness is this project's ship gate, and a build-only check would
# have gone green through the entire armv7 SIGBUS - that bug only ever
# showed up at runtime.
#
# Every target drives the front-end through the src/host_emu x86
# interpreter (the native PE loader was retired 2026-07-22), so nothing
# here has to execute 32-bit x86 code natively - that is what lets the
# same source build byte-identical output on arm64 and x86_64 alike.
#
# The FE DLL (SWIttsFe-en-US.dll) is committed at bin/ in the repo and
# is embedded into spfy_sapi.dll + spfy_synth(.exe) at build time via
# embed_dll.py - no proprietary asset wrangling needed in CI.

name: Build installer

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version string to stamp on the installer (default: today's UTC date as YYYY.MM.DD)"
        required: false

permissions:
  contents: write     # needed to create / update a Release

jobs:
  # --------------------------------------------------------------------
  # setup - resolve the date-based version once, share with both builds
  # and the release job so they all agree on the string.
  # --------------------------------------------------------------------

  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      versioninfo: ${{ steps.ver.outputs.versioninfo }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          # Date-based versioning (calver). Avoids the maintenance burden
          # of semver/v-tags and prevents confusion with unrelated GitHub
          # releases (most of which are v1/v2/v3).
          #
          # Two outputs:
          #   version      - user-facing date string (YYYY.MM.DD), used in
          #                  filenames, artifact names, release tag, and
          #                  AppVersion.
          #   versioninfo  - PE VersionInfo string (YYYY.MM.DD.RUN). Inno
          #                  Setup's VersionInfoVersion is strict X.X.X.X
          #                  numeric; the GitHub run number gives us a
          #                  monotonic 4th component for same-day rebuilds.
          override="${{ github.event.inputs.version_override }}"
          if [ -n "$override" ]; then
            v="$override"
          else
            v="$(date -u +%Y.%m.%d)"
          fi
          run_num="${{ github.run_number }}"
          [ -z "$run_num" ] && run_num="0"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            vinfo="$v"
          elif [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            vinfo="$v.$run_num"
          else
            vinfo="0.0.0.$run_num"
          fi
          echo "Version:     $v"
          echo "VersionInfo: $vinfo"
          echo "version=$v"         >> "$GITHUB_OUTPUT"
          echo "versioninfo=$vinfo" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------
  # build-windows - msys2 + Inno Setup. Produces the .exe installer.
  # --------------------------------------------------------------------

  build-windows:
    needs: setup
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    strategy:
      # Same reason as build-unix: one arch failing shouldn't hide the other's
      # result. The release job still requires BOTH - they are both shipped
      # deliverables now, not a primary and a nice-to-have.
      fail-fast: false
      matrix:
        include:
          # 64-bit Windows. Ships spfy_sapi64.dll alongside the 32-bit COM
          # DLL and registers through SysWOW64\regsvr32.
          #
          # `guiTarget` empty means "build for the host triple", which on any
          # Windows runner is x86_64 and lands in target\release.
          - arch: x64
            build64: true
            guiTarget: ""
            guiArch: "i386:x86-64"
          # 32-bit Windows, down to Windows 7 SP1 (Inno's own default
          # MinVersion floor, which this script does not override).
          #
          # It is a SEPARATE INSTALLER rather than one universal build: there
          # is no spfy_sapi64.dll to ship and regsvr32 lives in System32, so
          # a combined installer would carry a 64-bit DLL it could never
          # install. The payload needed no change at all - spfy_sapi.dll and
          # spfy_synth.exe are already i686, min OS 4.0, msvcrt (not UCRT)
          # and import nothing newer than NT 6.1. Only the installer's
          # ArchitecturesAllowed was refusing to run.
          # ⭐ The GUI is i686 here, not x86_64. `cargo build` with no --target
          # would produce an x86_64 exe that compiles into this installer
          # perfectly happily and then refuses to start for every 32-bit user,
          # so the target is explicit and the arch is ASSERTED after linking.
          # Measured 2m20s and the self-check passes, same as x64.
          - arch: x86
            build64: false
            guiTarget: "i686-pc-windows-msvc"
            guiArch: "i386"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      # --------------------------------------------------------------
      # msys2 - install BOTH 32-bit and 64-bit toolchains in one shot
      # --------------------------------------------------------------

      - name: Set up msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            python

      # --------------------------------------------------------------
      # Build the 32-bit project (CMake + Ninja, mingw32 toolchain)
      # --------------------------------------------------------------

      # SPFY_STRICT_FP is no longer forced OFF here. It used to be, which meant
      # the SHIPPED Windows binary had less FP pinning than any local build
      # (build32.bat leaves it ON) - a real divergence for a project whose
      # claim is byte-exactness. The costly part of that flag set was only
      # -ffloat-store, and SPFY_FLOAT_STORE now defaults OFF on its own, so
      # this leg keeps -fexcess-precision=standard / -mno-fma / -fno-fast-math
      # AND is faster than the old configuration.
      - name: Configure 32-bit
        shell: msys2 {0}
        run: |
          export PATH="/mingw32/bin:$PATH"
          mkdir -p /c/tmp/spfy_build32
          /mingw64/bin/cmake.exe \
            -S "$(cygpath -u '${{ github.workspace }}')/spfy" \
            -B /c/tmp/spfy_build32 \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/mingw64/bin/ninja.exe \
            -DCMAKE_C_COMPILER=/mingw32/bin/gcc.exe \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPFY_BUILD_TESTS=OFF \
            -DSPFY_FE_HOSTED=ON \
            -DSPFY_VERSION="${{ needs.setup.outputs.version }}"

      - name: Build 32-bit
        shell: msys2 {0}
        run: |
          export PATH="/mingw32/bin:$PATH"
          /mingw64/bin/cmake.exe --build /c/tmp/spfy_build32

      # --------------------------------------------------------------
      # Build the 64-bit SAPI shim (mingw64, standalone gcc invocation)
      # --------------------------------------------------------------

      - name: Build 64-bit SAPI shim
        if: matrix.build64
        shell: msys2 {0}
        run: |
          SRCDIR="$(cygpath -u '${{ github.workspace }}')/spfy/src/sapi"
          DSPDIR="$(cygpath -u '${{ github.workspace }}')/spfy/src/dsp"
          OUTDIR="/c/tmp/spfy_build32/src/sapi"
          mkdir -p "$OUTDIR"
          # -static -static-libgcc: avoid runtime dep on libgcc_s_seh-1.dll
          # / libwinpthread-1.dll on stock Windows VMs.
          /mingw64/bin/gcc.exe -shared -O2 \
            -DUNICODE -D_UNICODE -DWIN32_LEAN_AND_MEAN -DCOBJMACROS -DCINTERFACE \
            -I "$SRCDIR" -I "$DSPDIR" \
            -o "$OUTDIR/spfy_sapi64.dll" \
            "$SRCDIR/spfy_sapi64.c" \
            "$DSPDIR/pitch_shift.c" \
            "$DSPDIR/time_stretch.c" \
            "$SRCDIR/spfy_sapi64.def" \
            -lole32 -loleaut32 -ladvapi32 -lshell32 -luuid \
            -static -static-libgcc \
            -Wl,--kill-at \
            -Wl,--out-implib,"$OUTDIR/libspfy_sapi64.dll.a"

      # --------------------------------------------------------------
      # Build the GUI (Tauri) - x64 leg only
      # --------------------------------------------------------------

      # ⚠ PLAIN `cargo build`, NOT `tauri build`. There is no bundler and no
      # beforeBuildCommand: tauri.conf.json sets `frontendDist: "../web"`
      # (static files, already in the repo) and `bundle.active: false`, so the
      # whole job is compiling one Rust binary. Going through the Tauri CLI
      # would drag in Node and npm to produce the identical spfy_gui.exe.
      #
      # windows-latest ships a stable rustup toolchain, so there is nothing to
      # install beyond the extra std for the 32-bit target. WebView2 is a
      # RUNTIME dependency only - not linked here - and its runtime carries
      # both an x86 and an x64 loader, which is why an i686 GUI works on the
      # same machines the x64 one does.
      - name: Build the GUI (Tauri)
        env:
          GUI_TARGET: ${{ matrix.guiTarget }}
        run: |
          $manifest = "${{ github.workspace }}\spfy\gui\src-tauri\Cargo.toml"
          $targetArgs = @()
          if ($env:GUI_TARGET) {
            rustup target add $env:GUI_TARGET
            if ($LASTEXITCODE -ne 0) { Write-Error "rustup target add failed"; exit 1 }
            $targetArgs = @("--target", $env:GUI_TARGET)
          }
          cargo build --release --locked @targetArgs --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) {
            Write-Error "cargo build failed for the GUI"
            exit 1
          }

      # The architecture is ASSERTED, not just printed: a silently 64-bit
      # spfy_sapi.dll would still install and still regsvr32 "successfully"
      # under the wrong loader.
      #
      # ⛔ NOT `file | grep`. Its wording is not stable across versions -
      # file 5.46 prints "Intel i386" where older builds printed
      # "Intel 80386", and a grep for the wrong one fails a perfectly good
      # binary. `objdump -f` emits a machine token instead of prose:
      #     32-bit -> architecture: i386,
      #     64-bit -> architecture: i386:x86-64,
      # Note the 64-bit token CONTAINS the 32-bit one, so this compares the
      # extracted field exactly rather than grepping for a substring.
      #
      # ⛔ IT MUST BE THE x86_64 objdump. The i686 binutils cannot read a
      # PE32+ at all - it prints "file format not recognized" and yields an
      # EMPTY architecture, which a naive comparison then reports as a wrong
      # architecture. The empty case is therefore its own error: "could not
      # read" and "built wrong" must not look alike.
      - name: Verify build outputs
        shell: msys2 {0}
        run: |
          set -eu
          for c in /mingw64/bin/objdump.exe /usr/bin/objdump; do
            [ -x "$c" ] && OBJDUMP="$c" && break
          done
          : "${OBJDUMP:=$(command -v objdump)}"
          echo "  objdump: $OBJDUMP"
          arch_of() {
            "$OBJDUMP" -f "$1" 2>/dev/null | sed -n 's/^architecture: \([^,]*\),.*/\1/p'
          }
          check() {   # <path> <expected-token>
            got=$(arch_of "$1")
            printf '  %-18s %-14s %s\n' "$(basename "$1")" "${got:-?}" "$(file -b "$1")"
            [ -n "$got" ] || { echo "::error::$OBJDUMP could not read $1"; exit 1; }
            [ "$got" = "$2" ] || { echo "::error::$(basename "$1") is '$got', expected '$2'"; exit 1; }
          }
          ls -la /c/tmp/spfy_build32/src/sapi/spfy_sapi.dll
          ls -la /c/tmp/spfy_build32/src/cli/spfy_synth.exe
          check /c/tmp/spfy_build32/src/sapi/spfy_sapi.dll i386
          check /c/tmp/spfy_build32/src/cli/spfy_synth.exe i386
          if [ "${{ matrix.build64 }}" = "true" ]; then
            ls -la /c/tmp/spfy_build32/src/sapi/spfy_sapi64.dll
            check /c/tmp/spfy_build32/src/sapi/spfy_sapi64.dll i386:x86-64
          else
            # The x86 installer must not be able to pick one up by accident:
            # if a stale 64-bit DLL were present the [Files] #if would still
            # exclude it, but its absence here is the cheaper proof.
            test ! -f /c/tmp/spfy_build32/src/sapi/spfy_sapi64.dll \
              || { echo "::error::unexpected spfy_sapi64.dll on the x86 leg"; exit 1; }
            echo "  spfy_sapi64.dll    (absent, as expected on the x86 leg)"
          fi
          # ⛔ THE GUI'S ARCH IS THE ONE MOST LIKELY TO BE SILENTLY WRONG. An
          # x86_64 spfy_gui.exe compiles into the x86 installer without a
          # murmur from Inno and then fails to start for every 32-bit user, so
          # matrix.guiArch is asserted rather than assumed. The two arches also
          # come from DIFFERENT cargo directories - target\release for the host
          # build, target\<triple>\release when --target was passed - and
          # checking the wrong path would silently pass on a stale binary.
          GUIROOT="$(cygpath -u '${{ github.workspace }}')/spfy/gui/src-tauri/target"
          if [ -n "${{ matrix.guiTarget }}" ]; then
            GUI="$GUIROOT/${{ matrix.guiTarget }}/release/spfy_gui.exe"
          else
            GUI="$GUIROOT/release/spfy_gui.exe"
          fi
          ls -la "$GUI"
          check "$GUI" "${{ matrix.guiArch }}"

      # ⚠ "IT COMPILED" IS NOT A PASSING GUI. This runs the real plumbing the
      # IPC commands call - resolve the engine, `--list-voices --json`, synth,
      # then the same sentence under SSML - and asserts the tagged arm is at
      # least 1.5x longer. That last one is the load-bearing check: before the
      # SSML pass existed the tagged arm was longer too, because the engine
      # READ THE TAGS OUT LOUD, so a length comparison alone could pass on a
      # broken build. It is a ratio against a measured plain-text baseline
      # from the same voice and the same binary.
      #
      # The two env vars stand in for what the installed layout gives for
      # free: spfy_synth.exe beside spfy_gui.exe in {app}, and voices under
      # {userdocs}\Speechify. Here the engine is in the build tree and the
      # voices are the repo's own en-US/ es-MX/ fr-CA/ folders.
      #
      # ⚠ spfy_gui.exe is `windows_subsystem = "windows"` and has no console
      # of its own; its --self-check calls AttachConsole to get one. That
      # fails under a CI shell, which is fine and NOT what is being tested -
      # pwsh hands the child inherited stdout/stderr HANDLES either way, so
      # the output below is real. The exit code is the gate regardless.
      - name: Self-check the GUI
        env:
          SPFY_SYNTH: C:\tmp\spfy_build32\src\cli\spfy_synth.exe
          SPFY_VOICE_DIR: ${{ github.workspace }}
          GUI_TARGET: ${{ matrix.guiTarget }}
        run: |
          $root = "${{ github.workspace }}\spfy\gui\src-tauri\target"
          $gui = if ($env:GUI_TARGET) {
            "$root\$env:GUI_TARGET\release\spfy_gui.exe"
          } else {
            "$root\release\spfy_gui.exe"
          }
          & $gui --self-check 2>&1 | ForEach-Object { "  $_" }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "spfy_gui --self-check failed (exit $LASTEXITCODE)"
            exit 1
          }

      # --------------------------------------------------------------
      # Inno Setup - package the installer
      # --------------------------------------------------------------

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          $isccArgs = @(
            "/DTargetArch=${{ matrix.arch }}"
            "/DBuildDir=C:\tmp\spfy_build32"
            "/DSourceRoot=${{ github.workspace }}"
            "/DSpfyVersion=${{ needs.setup.outputs.version }}"
            "/DSpfyVersionInfo=${{ needs.setup.outputs.versioninfo }}"
          )
          # /DWithGui adds spfy_gui.exe, the Start Menu entry, the App Paths
          # registration, the optional desktop icon and the finish-page launch
          # box. BOTH arches ship it now. GuiDir defaults per arch inside the
          # ISS to the cargo directory the build step above actually wrote to,
          # so there is nothing else to pass. The [Files] entry has NO
          # skipifsourcedoesntexist: if the cargo build silently produced
          # nothing, this must fail the compile rather than ship a Start Menu
          # shortcut pointing at a missing file.
          $isccArgs += "/DWithGui"
          Write-Host "  iscc $($isccArgs -join ' ')"
          & $iscc @isccArgs "${{ github.workspace }}\installer\spfy_setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compile failed"
            exit 1
          }
          Get-ChildItem "${{ github.workspace }}\installer\dist\"

      # Each leg must produce exactly the filename the release job asks for by
      # name. Globbing the upload would let an x86 leg that quietly compiled
      # the x64 script sail through and overwrite the real one on merge.
      - name: Verify installer filename
        run: |
          $ver = "${{ needs.setup.outputs.version }}"
          $suffix = if ("${{ matrix.arch }}" -eq "x86") { "-x86" } else { "" }
          $want = "${{ github.workspace }}\installer\dist\spfy-setup-$ver$suffix.exe"
          if (-not (Test-Path $want)) {
            Write-Error "expected $want, found: $(
              (Get-ChildItem "${{ github.workspace }}\installer\dist\*.exe" |
               ForEach-Object { $_.Name }) -join ', ')"
            exit 1
          }
          "{0}  {1:N0} bytes" -f (Split-Path $want -Leaf),
            (Get-Item $want).Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: spfy-installer-windows-${{ matrix.arch }}-${{ needs.setup.outputs.version }}
          path: installer/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------
  # build-unix - Linux + macOS matrix. No SAPI (Windows COM only); ships
  # the spfy_synth CLI + the runtime data files needed to synthesize
  # against a user-provided voice (VIN/VDB/VCF). Voices stay proprietary
  # and are not bundled.
  #
  # FE backend: every target drives the real SWIttsFe-<lang>.dll through
  # the src/host_emu x86 interpreter - the only backend since the native
  # PE loader was retired 2026-07-22. Verified byte-identical (same WAV
  # sha256) on Windows x86/x64, Linux x86/x86_64, Linux arm64, Linux
  # armv7 and macOS arm64. linux-x86 (i386) is still built for
  # 32-bit-only CPUs and VMs, and still needs gcc-multilib for its
  # 32-bit libc.
  #
  # SPFY_STRICT_FP pins x87 80-bit semantics. It is a no-op on ARM (no
  # x87 exists), and the CMake probe drops individual flags a compiler
  # rejects (AppleClang has no -mfpmath=387), warning rather than
  # failing. Measured 2026-07-22: x87 pinning is NOT load-bearing here -
  # ARM matches bit-for-bit without it, because the unit-selection path
  # is integer and the audio path is IEEE-stable.
  # --------------------------------------------------------------------

  build-unix:
    needs: setup

    strategy:
      # One target failing shouldn't hide results for the others.
      fail-fast: false
      matrix:
        include:
          # `timeout` is per-leg (see timeout-minutes below). Queue time
          # counts against it, so these are wall-clock budgets, not just
          # build time. 15 is a placeholder for the legs whose real
          # duration hasn't been measured - tighten to ~2x observed once
          # you've read them off a green run.
          # ⭐ EVERY LINUX LEG BUILDS IN A debian:bookworm CONTAINER, and the
          # reason is glibc, not tidiness.
          #
          # A binary is only as portable as the glibc it linked against. Built
          # natively on ubuntu-latest (24.04, glibc 2.39) these tarballs
          # referenced __isoc23_strtol@GLIBC_2.38 - a redirect the 2.39
          # HEADERS introduce, from no source change and with no warning - and
          # so refused to run on Debian 12, RHEL 9, Ubuntu 22.04 and every
          # Raspberry Pi OS bookworm install. That is most of the machines
          # anyone would actually put this on, and nothing in the build said
          # a word about it.
          #
          # bookworm's glibc 2.36 is the ceiling now, enforced after linking
          # by build_unix.sh (SPFY_MAX_GLIBC), so a runner-image bump cannot
          # quietly take it away again. armv7 already built this way and was
          # the only leg that stayed portable.
          #
          # `platform` is what docker runs as; `qemu` is set ONLY when that
          # needs emulating. amd64 on ubuntu-latest and arm64 on the arm
          # runner are both native, so they pay nothing for the container
          # beyond one apt-get.
          # ⚠ THE GUI USES A DIFFERENT CONTAINER FROM THE ENGINE ON THIS LEG,
          # and it is the only leg where they diverge. The C build is -m32
          # multilib on an amd64 root, which is fine for a compiler. It is not
          # fine for webkit: `libwebkit2gtk-4.1-dev:i386` pulls
          # gobject-introspection:i386 -> python3:i386, which Debian cannot
          # install multi-arch, so there is no i386 webkit on an amd64 root at
          # all. A real i386 userland has it natively, and costs nothing on an
          # x86_64 host -- i386 runs on the metal, no emulation.
          - id: linux-x86
            runner: ubuntu-latest
            cflags: "-m32 -D_GNU_SOURCE=1"
            ldflags: "-m32"
            multilib: true
            qemu: ""
            image: "debian:bookworm"
            platform: "linux/amd64"
            osx_target: ""
            gui: true
            guiImage: "i386/debian:bookworm"
            guiPlatform: "linux/386"
            timeout: 35
          # GUI measured 1m54s in this exact image, highest glibc reference
          # 2.34 -- inside the 2.36 ceiling with room to spare.
          - id: linux-x86_64
            runner: ubuntu-latest
            cflags: "-D_GNU_SOURCE=1"
            ldflags: ""
            multilib: false
            qemu: ""
            image: "debian:bookworm"
            platform: "linux/amd64"
            osx_target: ""
            gui: true
            guiImage: "debian:bookworm"
            guiPlatform: "linux/amd64"
            timeout: 30
          # Native arm64 runner, so the GUI container is native too - this leg
          # pays nothing for emulation the way armv7 would.
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            cflags: "-D_GNU_SOURCE=1"
            ldflags: ""
            multilib: false
            qemu: ""
            image: "debian:bookworm"
            platform: "linux/arm64"
            osx_target: ""
            gui: true
            guiImage: "debian:bookworm"
            guiPlatform: "linux/arm64"
            timeout: 30
          # 32-bit ARM. There is NO hosted armv7 runner (ubuntu-24.04-arm
          # is aarch64), so this one builds in a qemu-emulated container on
          # an x86_64 runner. Cross-compiling would be far faster but the
          # runner couldn't execute the result - the same objection that
          # ruled out cross-compiling Intel macOS. debian:bookworm because
          # the Ubuntu armhf images are unreliable.
          #
          # Emulation makes this the slowest leg by a wide margin; the
          # timeout below is set from a measured local run, not a guess.
          #
          # ⭐ THE GUI ON THIS LEG IS CROSS-COMPILED, NOT EMULATED, and that is
          # the difference between a leg that finishes and one that does not.
          # The C engine is small enough to build under qemu; a ~400-crate
          # Rust build is not. Measured here: `apt-get install` of the webkit
          # dev packages inside an emulated armhf container ran past THIRTY
          # MINUTES before rustup had even started. The straightforward
          # alternative -- Debian multi-arch :armhf dev packages on an amd64
          # root -- is blocked outright by gobject-introspection:armhf.
          #
          # So guiPlatform is linux/amd64 while platform stays linux/arm/v7:
          # the GUI container is NATIVE and builds against an armhf sysroot
          # unpacked by mmdebstrap in ~30s. Same bookworm packages either way,
          # so the glibc 2.36 ceiling is unchanged.
          - id: linux-armv7
            runner: ubuntu-latest
            cflags: "-D_GNU_SOURCE=1"
            ldflags: ""
            multilib: false
            qemu: "linux/arm/v7"
            image: "debian:bookworm"
            platform: "linux/arm/v7"
            osx_target: ""
            gui: true
            guiImage: "debian:bookworm"
            guiPlatform: "linux/amd64"
            guiCross: "armhf"
            timeout: 40
          # ⭐ musl, STATICALLY linked -- the "runs anywhere" build.
          #
          # The glibc tarballs above cannot run on Alpine at all: their
          # interpreter is /lib64/ld-linux-x86-64.so.2 and musl systems have
          # /lib/ld-musl-x86_64.so.1, which is why the failure there is the
          # famously unhelpful "not found" on a file that plainly exists.
          #
          # `-static` rather than a dynamic musl build, because it costs
          # nothing extra and removes the libc question entirely: no
          # interpreter, no libc.so, no version floor. One binary for Alpine,
          # for a distro older than anything CI can build on, and for a
          # container FROM scratch. Verified byte-exact against the reference
          # WAV -- musl's libm does not move a single output sample.
          #
          # ⛔ NO GUI ON THE musl LEGS, AND THIS IS NOT AN OVERSIGHT. The whole
          # value of these two tarballs is in the paragraph above: one static
          # binary, no interpreter, no libc floor, works in a container FROM
          # scratch. A Tauri GUI cannot have that property. Alpine ships
          # webkit2gtk-4.1-dev but no static archives for it (checked), and
          # WebKitGTK is not practically statically linkable anywhere - so the
          # GUI here could only be a dynamically linked binary needing GTK,
          # WebKit and ~40 other shared objects present on the target. That is
          # the exact opposite of what someone reaches for a musl-static
          # tarball to get, and a FROM-scratch container has no display anyway.
          # Alpine desktop users build it from source; every other Linux user
          # has a glibc leg above with the GUI in it.
          - id: linux-x86_64-musl
            runner: ubuntu-latest
            cflags: "-D_GNU_SOURCE=1"
            ldflags: "-static"
            multilib: false
            qemu: ""
            image: "alpine:3.20"
            platform: "linux/amd64"
            osx_target: ""
            gui: false
            guiImage: ""
            guiPlatform: ""
            timeout: 20
          - id: linux-arm64-musl
            runner: ubuntu-24.04-arm
            cflags: "-D_GNU_SOURCE=1"
            ldflags: "-static"
            multilib: false
            qemu: ""
            image: "alpine:3.20"
            platform: "linux/arm64"
            osx_target: ""
            gui: false
            guiImage: ""
            guiPlatform: ""
            timeout: 20
          # ⭐ osx_target, because an unset deployment target means "whatever
          # this runner is". That is how the Intel tarball came to declare
          # macOS 15.0 - a floor that excludes every Intel Mac older than
          # 2018, i.e. most of the machines an Intel build is FOR. 11.0 is
          # Apple Silicon's own floor, so one number covers both arches, and
          # build_unix.sh reads the linked binary back to prove it took.
          #
          # macOS is the ONE platform where the GUI needs no extra dependency
          # at all: Tauri uses the system WKWebView, so `cargo build` on the
          # runner is the whole story - no container, no apt, no webkit to
          # install. The runners ship rustup already.
          - id: macos-arm64
            runner: macos-14
            cflags: ""
            ldflags: ""
            multilib: false
            qemu: ""
            image: ""
            platform: ""
            osx_target: "11.0"
            gui: true
            guiImage: ""
            guiPlatform: ""
            timeout: 25
          # Intel macOS. NOT macos-13 - that image was retired 2025-12-04
          # (deprecation began 2025-09-22), and requesting a dead label
          # doesn't error, it just queues until the job times out.
          # macos-15-intel is the last Intel-based image; GitHub drops
          # x86_64 macOS entirely when it retires in Fall 2027.
          #
          # Measured 12m33s on 2026-07-22 - by far the slowest leg, and
          # Intel capacity is being wound down ahead of that retirement,
          # so give it real headroom rather than a tight cap.
          - id: macos-x86_64
            runner: macos-15-intel
            cflags: ""
            ldflags: ""
            multilib: false
            qemu: ""
            image: ""
            platform: ""
            osx_target: "11.0"
            gui: true
            guiImage: ""
            guiPlatform: ""
            timeout: 45

    runs-on: ${{ matrix.runner }}

    # Per-leg budget (matrix.timeout) rather than one flat value. Queue time
    # counts against it, so a retired/unavailable runner label fails here
    # instead of hanging for the 6-hour default and blocking the release
    # behind it. A dead label burns the whole budget either way, so the fast
    # legs stay tight for quick detection while the known-slow Intel macOS
    # leg gets the headroom it actually needs.
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      # Kept for a leg that goes back to building on the runner itself. Every
      # Linux leg is containerised today, so this is currently inert -- a
      # container installs its own toolchain inside build_unix.sh, because one
      # `docker run` means a separate install step would be thrown away.
      - name: Install toolchain (Linux, native)
        if: runner.os == 'Linux' && matrix.image == ''
        run: |
          sudo apt-get update
          if [ "${{ matrix.multilib }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends \
              build-essential gcc-multilib g++-multilib \
              cmake ninja-build python3
          else
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build python3
          fi

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Registers the qemu-user binfmt handlers on the host so the runner
      # can exec foreign-arch binaries. Must happen on the HOST, before any
      # cross-arch container starts - a job-level `container:` would be too
      # late, which is why this leg shells out to `docker run` instead.
      - name: Set up QEMU
        if: matrix.qemu != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu }}

      # macOS only, now that every Linux leg is containerised. SPFY_OSX_-
      # DEPLOYMENT_TARGET is the whole point of this step's env block: unset,
      # the binary silently demands whatever macOS the runner happens to run.
      - name: Configure and build (native)
        if: matrix.image == ''
        env:
          SPFY_CFLAGS: ${{ matrix.cflags }}
          SPFY_LDFLAGS: ${{ matrix.ldflags }}
          SPFY_VERSION: ${{ needs.setup.outputs.version }}
          SPFY_OSX_DEPLOYMENT_TARGET: ${{ matrix.osx_target }}
        run: bash spfy/ci/build_unix.sh

      # Same script, inside the container. The workspace is bind-mounted, so
      # build-out lands on the host and the packaging steps below are shared
      # with the native legs.
      #
      # SPFY_MAX_GLIBC is the ceiling build_unix.sh enforces on what the
      # linked binary may reference. It matches the image on the line above
      # it, and README.md's compatibility table quotes the same number -- move
      # one and CI makes you move the others.
      - name: Configure and build (${{ matrix.image }} on ${{ matrix.platform }})
        if: matrix.image != ''
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "${GITHUB_WORKSPACE}:/w" -w /w \
            -e SPFY_CFLAGS="${{ matrix.cflags }}" \
            -e SPFY_LDFLAGS="${{ matrix.ldflags }}" \
            -e SPFY_VERSION="${{ needs.setup.outputs.version }}" \
            -e SPFY_INSTALL_DEPS=1 \
            -e SPFY_MULTILIB=${{ matrix.multilib && '1' || '0' }} \
            -e SPFY_MAX_GLIBC=2.36 \
            "${{ matrix.image }}" \
            sh -c 'command -v bash >/dev/null 2>&1 || apk add --no-cache bash >/dev/null; exec bash spfy/ci/build_unix.sh'
          # Container ran as root, so build-out is root-owned; hand it back
          # or the packaging steps below can't stage into it.
          sudo chown -R "$(id -u):$(id -g)" build-out

      # --------------------------------------------------------------
      # The GUI - separate toolchain, separate container, not every leg
      # --------------------------------------------------------------

      # ⚠ A SECOND CONTAINER, NOT THE ENGINE'S. matrix.guiImage is usually the
      # same image as matrix.image, but on linux-x86 it is deliberately
      # i386/debian:bookworm against the engine's amd64 -- see that leg's own
      # note. Reusing `image` there would silently build an x86_64 GUI for a
      # 32-bit tarball.
      - name: Build the GUI (${{ matrix.guiImage }} on ${{ matrix.guiPlatform }})
        if: matrix.gui && matrix.guiImage != ''
        run: |
          docker run --rm --platform "${{ matrix.guiPlatform }}" \
            -v "${GITHUB_WORKSPACE}:/w" -w /w \
            -e SPFY_GUI_OUT=/w/gui-out \
            -e SPFY_MAX_GLIBC=2.36 \
            -e SPFY_GUI_CROSS="${{ matrix.guiCross }}" \
            "${{ matrix.guiImage }}" \
            bash spfy/ci/build_gui_linux.sh
          sudo chown -R "$(id -u):$(id -g)" gui-out

      # No container and no dependency install: Tauri uses the system
      # WKWebView on macOS, so this is one cargo invocation.
      #
      # ⚠ MACOSX_DEPLOYMENT_TARGET is passed for the SAME reason build_unix.sh
      # takes SPFY_OSX_DEPLOYMENT_TARGET: unset, the binary silently demands
      # whatever macOS the runner happens to be, which is how the Intel CLI
      # once came to declare a 15.0 floor and exclude most Intel Macs. The
      # value is read back off the linked binary below rather than trusted.
      - name: Build the GUI (macOS)
        if: matrix.gui && runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.osx_target }}
        run: |
          set -eu
          cargo build --release --locked \
            --manifest-path spfy/gui/src-tauri/Cargo.toml
          mkdir -p gui-out
          cp spfy/gui/src-tauri/target/release/spfy_gui gui-out/spfy_gui
          file gui-out/spfy_gui
          echo "--- deployment target actually linked in ---"
          otool -l gui-out/spfy_gui |
            awk '/LC_BUILD_VERSION/,/sdk/' | grep -E 'minos|sdk' | head -2

      - name: Package tarball
        run: |
          set -eu
          VERSION="${{ needs.setup.outputs.version }}"
          PKG="spfy-${{ matrix.id }}-${VERSION}"
          STAGE="${RUNNER_TEMP}/spfy-stage/${PKG}"
          mkdir -p "${STAGE}/bin" "${STAGE}/en-US/tom"
          cp build-out/src/cli/spfy_synth          "${STAGE}/bin/"
          # The update checker. spfy_synth does its own check inline, so this
          # is here for `spfy_update --status` / --disable and for anyone who
          # wants to ask on demand - not because anything spawns it on unix.
          cp build-out/src/update/spfy_update      "${STAGE}/bin/"
          # No spfy/data or spfy/build in the tarball any more. spfy_synth
          # carries fe_symbol_table.json + fe_tables_a + fe_tables embedded
          # (src/cli/CMakeLists.txt) and extracts them to a tempdir on first
          # run, so the loose copies were ~1.7 MB of duplication in every one
          # of six tarballs. tom_hpclass.bin is gone for a different reason:
          # hpclass is passed NULL and derived per-voice from the VIN.
          # ⚠ This makes the 9-positional legacy CLI form unusable from the
          # tarball alone; the short form is the documented one.
          cp SPFY_README.md                        "${STAGE}/" || true
          cp SPEECHIFY_4_FINDINGS.md               "${STAGE}/" || true
          # Pitch marks for Speechify 4 mode (spfy_synth --s4). Analysis
          # metadata measured from the audio, not voice data, so these ship
          # while the VIN/VDB/VCF do not. They go in the voice folder because
          # the stem is derived from the VDB path (tom8.vdb -> tom8): the user
          # drops tom's trio in beside them and --s4 works with no further
          # setup. No `|| true` - `set -eu` is in force above and a tarball
          # whose --s4 silently does nothing is worse than a failed leg.
          cp en-US/tom/tom8.pmindex                "${STAGE}/en-US/tom/"
          cp en-US/tom/tom8.pmdata                 "${STAGE}/en-US/tom/"
          # --- Tom himself: the starter voice ---
          #
          # The sentence above used to end "the user drops tom's trio in
          # beside them". They no longer have to: the trio ships here, so an
          # extracted tarball speaks immediately with nothing downloaded and
          # no network at all.
          #
          # ~89.5 MB, and it is by far the largest thing in the package. Every
          # OTHER voice is still a download -- `spfy_synth --list-available`
          # and `--install-voice <name>`, which land in
          # ~/Documents/Speechify/<lang>/<voice>/ where --list-voices already
          # looks. Tom is bundled because it is the baseline the project is
          # built and gated against, not because it is anyone's favourite.
          #
          # No `|| true`, same as the pitch marks: `set -eu` is in force and a
          # tarball that quietly contains no voice is worse than a failed leg.
          # en-US/tom IS committed, so a runner has it from the checkout with
          # nothing to fetch.
          cp en-US/tom/tom.vin                     "${STAGE}/en-US/tom/"
          cp en-US/tom/tom8.vdb                    "${STAGE}/en-US/tom/"
          cp en-US/tom/tom.vcf                     "${STAGE}/en-US/tom/"

          # --- The GUI, and the bit that makes it an APPLICATION ---
          #
          # ⚠ A BARE BINARY IN bin/ IS NOT A PORTED GUI. It runs from a
          # terminal and is invisible to every applications menu, which is the
          # one place a non-command-line user would look. Windows gets a Start
          # Menu shortcut from the Inno script; the two platforms here need
          # their own native equivalent, so each gets one.
          if [ "${{ matrix.gui }}" = "true" ]; then
            test -f gui-out/spfy_gui \
              || { echo "::error::gui=true but no gui-out/spfy_gui"; exit 1; }
            cp gui-out/spfy_gui                    "${STAGE}/bin/"
            chmod +x "${STAGE}/bin/spfy_gui"
            case "${{ matrix.id }}" in
              macos-*)
                # A .app is just a directory with Info.plist in it, so it is
                # built here rather than by Tauri's bundler -- which stays off
                # (bundle.active=false) so the Windows path is unaffected.
                #
                # ⚠ SELF-CONTAINED ON PURPOSE: spfy_synth is copied IN, not
                # symlinked out to bin/. The GUI finds the engine "next to
                # itself", and a macOS user drags the .app to /Applications --
                # at which point any relative link back into the extracted
                # tarball is dangling and the app opens to "engine not found".
                APP="${STAGE}/Speechify.app"
                mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
                cp gui-out/spfy_gui                "${APP}/Contents/MacOS/"
                cp build-out/src/cli/spfy_synth    "${APP}/Contents/MacOS/"
                chmod +x "${APP}/Contents/MacOS/spfy_gui" \
                         "${APP}/Contents/MacOS/spfy_synth"
                cp spfy/gui/src-tauri/icons/icon.icns \
                                                   "${APP}/Contents/Resources/icon.icns"
                sed "s/@VERSION@/${VERSION}/g" spfy/gui/macos/Info.plist.in \
                    > "${APP}/Contents/Info.plist"
                echo "  built Speechify.app"
                ;;
              *)
                # Linux: the .desktop file cannot be shipped ready-made
                # because Exec= must be absolute and the tarball is
                # relocatable, so install-desktop.sh writes it at run time
                # from wherever the user extracted to.
                mkdir -p "${STAGE}/share"
                cp spfy/gui/src-tauri/icons/128x128@2x.png \
                                                   "${STAGE}/share/speechify.png"
                cp spfy/gui/linux/install-desktop.sh "${STAGE}/"
                chmod +x "${STAGE}/install-desktop.sh"
                echo "  staged install-desktop.sh + icon"
                ;;
            esac
          else
            # musl legs. Asserted rather than assumed: a stray gui-out here
            # would mean the static-only contract had quietly been broken.
            test ! -e gui-out \
              || { echo "::error::gui=false but gui-out exists on ${{ matrix.id }}"; exit 1; }
            echo "  no GUI on this leg (static musl; see the matrix note)"
          fi

          # Path layout inside the tarball mirrors the args spfy_synth
          # expects, so users can extract and run from the package root.
          mkdir -p installer/dist
          tar -czf "installer/dist/${PKG}.tar.gz" \
            -C "${RUNNER_TEMP}/spfy-stage" "${PKG}"
          ls -la installer/dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: spfy-installer-${{ matrix.id }}-${{ needs.setup.outputs.version }}
          path: installer/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------
  # release - dated GitHub Release with both platforms attached. Only
  # fires on push events (main branch or tag); workflow_dispatch stops
  # at artifact upload.
  # --------------------------------------------------------------------

  release:
    needs: [setup, build-windows, build-unix]
    # `needs:` defaults to requiring EVERY listed job to succeed, so a single
    # build-unix matrix leg failing (or being cancelled - e.g. a retired
    # runner label that never gets picked up) used to skip the release
    # entirely, throwing away the targets that did build.
    #
    # !cancelled() still honours cancelling the whole workflow run: that
    # suppresses the release as you'd expect. What it no longer does is let
    # one optional target veto publishing. The real gate is below - the
    # version resolved and the Windows installer built; unix tarballs are
    # published if they made it, and any that didn't are flagged as
    # warnings in the run summary.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.setup.result == 'success'
      && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      # ⚠ FIRST, and it has to be. This job used to have no checkout at all --
      # it only downloads artifacts -- so the manifest step below failed with
      # "not a git repository" and "can't open installer/updates/
      # make_manifest.py" on 2026.08.23, AFTER the release had already been
      # published. Second: checkout cleans the workspace, so running it after
      # download-artifact would delete dist/.
      #
      # Sparse + blob:none because the voice tree is ~2.6 GB of this repo and
      # this job needs two Python files. History still comes down, which is
      # what `git log -1` for the [no-notify] marker needs.
      - name: Check out the manifest tooling
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: installer/updates
          sparse-checkout-cone-mode: true

      # One pattern pull grabs the Windows installer plus every matrix
      # tarball (linux-x86 / linux-x86_64 / linux-armv7 / linux-arm64 /
      # macos-*), so adding a target to the matrix needs no change here.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: spfy-installer-*-${{ needs.setup.outputs.version }}
          path: dist
          merge-multiple: true

      # A partial release is allowed (see the job's `if:`), so make it
      # loud rather than silently short: annotate every target that didn't
      # produce a tarball.
      - name: List release payload
        run: |
          set -eu
          echo "Publishing:"
          ls -la dist/
          missing=0
          # Windows first, and by exact name. `fail_on_unmatched_files: false`
          # is required for the partial-unix-release behaviour, which means a
          # missing .exe would otherwise be published silently.
          for w in "spfy-setup-${{ needs.setup.outputs.version }}.exe" \
                   "spfy-setup-${{ needs.setup.outputs.version }}-x86.exe"; do
            if [ ! -f "dist/$w" ]; then
              echo "::warning title=Missing installer::$w did not build - release is partial"
              missing=$((missing + 1))
            fi
          done
          # ⚠ Exact filenames, not spfy-"$t"-*.tar.gz. The musl ids extend the
          # glibc ones, so `spfy-linux-x86_64-*` also matches
          # spfy-linux-x86_64-musl-<ver>.tar.gz -- and a missing glibc tarball
          # would then be "found" by its musl sibling and never reported.
          n_unix=0
          for t in linux-x86 linux-x86_64 linux-armv7 linux-arm64 \
                   linux-x86_64-musl linux-arm64-musl \
                   macos-arm64 macos-x86_64; do
            n_unix=$((n_unix + 1))
            if [ ! -f "dist/spfy-$t-${{ needs.setup.outputs.version }}.tar.gz" ]; then
              echo "::warning title=Missing target::no artifact for $t - release is partial"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning title=Partial release::$missing target(s) missing from this release"
          else
            echo "all $n_unix unix targets present"
          fi

      - name: Resolve release tag
        id: tag
        run: |
          # Tag pushes keep their own ref; main pushes get the date version
          # as a programmatically-created tag (softprops/action-gh-release
          # creates it from tag_name if it doesn't already exist).
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ needs.setup.outputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          name: "spfy ${{ steps.tag.outputs.tag }}"
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          # false, deliberately: the setting is all-or-nothing across every
          # pattern, so with a partial release allowed, `dist/*.tar.gz`
          # matching nothing (every unix leg failed) would hard-fail here and
          # throw away the Windows installer too. The job's `if:` already
          # guarantees build-windows succeeded, so the .exe is always there,
          # and the payload step above annotates anything missing.
          fail_on_unmatched_files: false
          files: |
            dist/spfy-setup-${{ needs.setup.outputs.version }}.exe
            dist/spfy-setup-${{ needs.setup.outputs.version }}-x86.exe
            dist/*.tar.gz

      # ------------------------------------------------------------------
      # update.json - the one file every installed copy polls.
      #
      # It lives on a ROLLING `updates` tag, so the URL baked into every
      # binary ever shipped stays valid:
      #   .../releases/download/updates/update.json
      #
      # TWO workflows write it. This one knows the engine version and nothing
      # about voices; publish-voices.yml knows the voice catalog and nothing
      # about this release. Whichever runs must carry the other's half
      # forward, which is what --merge-from does. make_manifest.py refuses to
      # write an empty voices array unless told to, because losing it would
      # switch off every voice notification with nothing in the log to say so.
      #
      # NOT marked "Latest": that badge belongs to the dated engine release,
      # which is what a human landing on the Releases page should see.
      # ------------------------------------------------------------------
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p current
          merge="--allow-empty-voices"
          if gh release download updates --repo "$GITHUB_REPOSITORY" \
               --pattern 'update.json' --dir current 2>/dev/null; then
            merge="--merge-from current/update.json"
          else
            echo "::notice title=First manifest::no updates/update.json yet - \
          publishing an engine-only manifest. Run publish-voices.yml to add \
          the voice catalog."
          fi

          # A release nobody needs to hear about: put the version in the
          # manifest but leave notify false, and the next release that does
          # matter tells them instead.
          notify=""
          if git log -1 --pretty=%B | grep -qiE '\[(no-notify|skip notify)\]'; then
            notify="--no-engine-notify"
            echo "::notice title=Quiet release::[no-notify] in the commit message"
          fi

          # shellcheck disable=SC2086
          python3 installer/updates/make_manifest.py \
            --engine-version "${{ needs.setup.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --engine-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ steps.tag.outputs.tag }}" \
            $merge $notify \
            -o update.json
          cat update.json | head -20

          gh release view updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create updates --repo "$GITHUB_REPOSITORY" \
              --title "update manifest" --latest=false --prerelease \
              --notes "Machine-readable manifest polled by installed copies of spfy. Not a download."
          gh release upload updates update.json --repo "$GITHUB_REPOSITORY" --clobber
